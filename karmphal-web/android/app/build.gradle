apply plugin: 'com.android.application'

// Optional keystore.properties loader if present
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.karmphal.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.karmphal.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        def rawVersionCode = System.getenv("VERSION_CODE") ?: project.findProperty("VERSION_CODE")?.toString()
        if (!rawVersionCode) {
            gradle.taskGraph.whenReady { taskGraph ->
                if (taskGraph.allTasks.any { it.name.toLowerCase().contains("release") && !it.name.toLowerCase().contains("test") }) {
                    throw new GradleException("FATAL: VERSION_CODE environment variable or -PVERSION_CODE property must be explicitly provided for release builds (first release = 1).")
                }
            }
        }
        versionCode (rawVersionCode ? rawVersionCode.toInteger() : 1)
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("RELEASE_STORE_FILE") ?: keystoreProperties['RELEASE_STORE_FILE'] ?: project.findProperty("RELEASE_STORE_FILE") ?: "release.keystore"
            def storePasswordVal = System.getenv("RELEASE_STORE_PASSWORD") ?: keystoreProperties['RELEASE_STORE_PASSWORD'] ?: project.findProperty("RELEASE_STORE_PASSWORD")
            def keyAliasVal = System.getenv("RELEASE_KEY_ALIAS") ?: keystoreProperties['RELEASE_KEY_ALIAS'] ?: project.findProperty("RELEASE_KEY_ALIAS")
            def keyPasswordVal = System.getenv("RELEASE_KEY_PASSWORD") ?: keystoreProperties['RELEASE_KEY_PASSWORD'] ?: project.findProperty("RELEASE_KEY_PASSWORD")

            def kFile = storeFilePath ? file(storeFilePath) : null
            if (kFile != null && !kFile.exists()) {
                kFile = rootProject.file(storeFilePath)
            }
            if (kFile != null && kFile.exists() && storePasswordVal && keyAliasVal && keyPasswordVal) {
                storeFile kFile
                storePassword storePasswordVal
                keyAlias keyAliasVal
                keyPassword keyPasswordVal
            } else {
                gradle.taskGraph.whenReady { taskGraph ->
                    if (taskGraph.allTasks.any { it.name.toLowerCase().contains("release") && !it.name.toLowerCase().contains("test") }) {
                        throw new GradleException("FATAL: Release signing credentials are missing or incomplete. Refusing to build unsigned or fallback release APK/AAB.")
                    }
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register("verifyReleaseApiBaseUrl") {
    doLast {
        def envUrl = System.getenv("VITE_API_BASE_URL")
        if (envUrl != null && !envUrl.isEmpty()) {
            if (!envUrl.startsWith("https://")) {
                throw new GradleException("FATAL: VITE_API_BASE_URL must begin with https:// for Android release builds, got: " + envUrl)
            }
        }
        def assetsPublic = file("src/main/assets/public")
        if (assetsPublic.exists()) {
            def jsFiles = fileTree(dir: assetsPublic, include: '**/*.js')
            def foundHttpsApi = false
            for (File f : jsFiles) {
                if (f.text.contains("https://") && (f.text.contains("/api") || f.text.contains("api."))) {
                    foundHttpsApi = true
                    break
                }
            }
            if (!foundHttpsApi && (envUrl == null || !envUrl.startsWith("https://"))) {
                throw new GradleException("FATAL: Release assets in src/main/assets/public do not contain a valid https API base URL. Set VITE_API_BASE_URL=https://... and rebuild web assets.")
            }
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.startsWith("assembleRelease") || task.name.startsWith("bundleRelease")) {
        task.dependsOn "verifyReleaseApiBaseUrl"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
