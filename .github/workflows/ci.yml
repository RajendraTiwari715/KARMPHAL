name: CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-pipeline:
    name: Continuous Integration & Test Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            karmphal-backend/package-lock.json
            karmphal-web/package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: karmphal-backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: karmphal-web
        run: npm ci

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Audit Dependencies (Zero High Vulnerabilities)
        run: |
          npm audit --audit-level=high
          npm --prefix karmphal-backend audit --audit-level=high
          npm --prefix karmphal-web audit --audit-level=high

      - name: Run Oxlint (Deny Warnings)
        run: |
          npx oxlint --deny-warnings
          npx --prefix karmphal-web oxlint --deny-warnings
          npx --prefix karmphal-backend oxlint --deny-warnings

      - name: Verify Asset Integrity (check:assets)
        working-directory: karmphal-web
        run: npm run check:assets

      - name: Run Backend Tests with Coverage (Mocked Gemini)
        working-directory: karmphal-backend
        run: npm run test:coverage

      - name: Run Frontend Tests with Coverage (Vitest + Testing Library)
        working-directory: karmphal-web
        run: npm run test:coverage

      - name: Build Frontend Production Bundle (vite build)
        working-directory: karmphal-web
        run: npm run build

      - name: Verify Bundle Size Budget Limits
        run: node scripts/check-bundle-size.mjs

      - name: Install Playwright Browsers
        working-directory: karmphal-web
        run: npx playwright install --with-deps chromium

      - name: Run Visual Assets & Screenshots Test
        working-directory: karmphal-web
        run: npm run test:visual-assets

